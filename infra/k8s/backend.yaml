apiVersion: apps/v1
kind: Deployment
metadata:
  name: sa-bookings-backend
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sa-bookings-backend
  template:
    metadata:
      labels:
        app: sa-bookings-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/sa-bookings/backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: secret_key
            - name: REDIS_HOST
              value: "sa-bookings-redis"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sa-bookings-backend
spec:
  selector:
    app: sa-bookings-backend
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
