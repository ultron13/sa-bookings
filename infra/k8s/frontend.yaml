apiVersion: apps/v1
kind: Deployment
metadata:
  name: sa-bookings-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sa-bookings-frontend
  template:
    metadata:
      labels:
        app: sa-bookings-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/sa-bookings/frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sa-bookings-frontend
spec:
  selector:
    app: sa-bookings-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
